buildscript {
    repositories {
        mavenCentral()
        maven {
            url = "https://maven.minecraftforge.net"
        }
        maven {
            url = "https://jitpack.io"
        }
    }

    dependencies {
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

apply plugin: 'forge'

version = "1.0"
group = "com.magicmod"
archivesBaseName = "MagicStaffs"

sourceCompatibility = targetCompatibility = 1.8
compileJava.sourceCompatibility = compileJava.targetCompatibility = 1.8

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}
